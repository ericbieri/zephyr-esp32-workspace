# Zephyr-oriented OpenOCD config for ESP32-S2 requires an external USB-JTAG adapter.

# Disable FreeRTOS thread awareness for Zephyr builds before loading targets.
set ESP_RTOS none

source [find board/esp32s2-bridge.cfg]

adapter speed 20000
tcl port 6666
telnet port 4444
gdb port 3333

init
halt

# Must be set before GDB attaches so OpenOCD can expose the correct flash map.
esp appimage_offset 0x0000
