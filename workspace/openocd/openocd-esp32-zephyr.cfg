# Zephyr-oriented OpenOCD config for ESP32 with external ESP32Prog/FTDI JTAG.

# Disable FreeRTOS thread awareness for Zephyr builds before loading targets.
set ESP_RTOS none
set ESP_ONLYCPU 1
set ESP32_FLASH_VOLTAGE 3.3

source [find interface/ftdi/esp_ftdi.cfg]
ftdi tdo_sample_edge falling
source [find target/esp32.cfg]

adapter speed 5000
tcl port 6666
telnet port 4444
gdb port 3333

init
reset halt

# Must be set before GDB attaches so OpenOCD can expose the correct flash map.
esp appimage_offset 0x20000
