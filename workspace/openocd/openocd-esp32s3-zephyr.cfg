# Zephyr-oriented OpenOCD config for ESP32-S3 builtin USB-JTAG.
#
# Start OpenOCD with:
# /opt/toolchains/debug/openocd-esp32/bin/openocd \
#   -s /opt/toolchains/debug/openocd-esp32/share/openocd/scripts \
#   -f /workspace/openocd/openocd-esp32s3-zephyr.cfg
#
# If your image is not built with MCUboot/sysbuild, change the application
# image offset below from 0x20000 to the correct value for your flash layout
# (often 0x10000 for a plain image).

# Disable FreeRTOS thread awareness for Zephyr builds before loading targets.
set ESP_RTOS none

source [find board/esp32s3-builtin.cfg]

adapter speed 20000
tcl port 6666
telnet port 4444
gdb port 3333

init
halt

# Must be set before GDB attaches so OpenOCD can expose the correct flash map.
esp appimage_offset 0x0000
